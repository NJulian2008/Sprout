<div class="skill-item" data-skill-item data-skill-id="{{ skill_id }}" data-confidence="{{ confidence }}">
  <div class="skill-chip-row">
    <button class="chip skill-chip" type="button" data-skill-toggle aria-expanded="false" aria-controls="skill-editor-{{ skill_id }}">
      <span data-skill-name>{{ skill_name }}</span>
    </button>
    <button class="remove-skill" type="button" data-remove-skill aria-label="Remove {{ skill_name }}">×</button>
  </div>
  <div class="chip-editor" id="skill-editor-{{ skill_id }}" data-skill-panel hidden>
    <label class="slider-label" for="skill-confidence-{{ skill_id }}">Confidence</label>
    <input class="confidence-slider" type="range" id="skill-confidence-{{ skill_id }}" min="0" max="100" step="5" value="{{ confidence }}" aria-label="Confidence for {{ skill_name }}" data-confidence-slider>
  </div>
</div>
